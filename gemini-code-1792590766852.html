<!-- Load today's separate daily file -->
<script src="dispatch-2026-10-21.js"></script>
<script>
window.addEventListener("DOMContentLoaded", () => {
  const d = window.DAILY_DISPATCH.index;
  if (!d) return;

  // Object-oriented property mapper loads everything into the DOM instantly
  Object.keys(d).forEach(key => {
    const el = document.getElementById(key);
    if (el) el.textContent = d[key];
  });
});
</script>
