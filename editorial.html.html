<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial Dispatch — visva.world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a08;
  --surface:#151410;
  --card-bg:#ffffff;
  --card-ink:#11110f;
  --card-muted:#5e5a50;
  --text-primary:#eeeae0;
  --text-muted:#8e887b;
  --accent-red:#b3261e;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text-primary);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;}
.wrap{max-width:800px;margin:0 auto;padding:0 20px;}
a{color:inherit;text-decoration:none}
.top-red-bar{background:var(--accent-red);color:#ffffff;font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:40px;}
.top-red-bar .wrap{display:flex;justify-content:space-between;align-items:center;min-height:42px;}
.top-red-bar a{color:#ffffff;font-weight:600;}
.editorial-box{background:var(--card-bg);color:var(--card-ink);border-radius:12px;padding:48px 56px;margin-bottom:60px;}
.back-link{font-size:13px;font-weight:600;color:var(--accent-red);text-transform:uppercase;letter-spacing:.08em;display:inline-block;margin-bottom:24px;}
h1.editorial-title{font-family:var(--serif);font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1.15;margin-bottom:16px;letter-spacing:-.01em;}
p.editorial-subtitle{font-size:18px;color:var(--card-muted);line-height:1.6;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid #f0ede4;}
.editorial-section{margin-bottom:32px;}
.editorial-section h3{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--card-ink);margin-bottom:12px;}
.editorial-section p{font-size:16px;color:var(--card-muted);line-height:1.75;margin-bottom:16px;}
@media(max-width:768px){.editorial-box{padding:32px 24px;}}
</style>
</head>
<body>

<div class="top-red-bar">
  <div class="wrap">
    <span>visva.world · Editorial Record</span>
    <a href="index.html">← Back to Today's Move</a>
  </div>
</div>

<main class="wrap">
  <article class="editorial-box">
    <a href="index.html" class="back-link">← Return to Front Page Matrix</a>
    <h1 class="editorial-title" id="edTitle">Loading Editorial...</h1>
    <p class="editorial-subtitle" id="edSubtitle">Please hold while the daily record is retrieved.</p>
    
    <div id="edContentContainer">
      <!-- Dynamic sections inject here -->
    </div>
  </article>
</main>

<script>
window.addEventListener("DOMContentLoaded", () => {
  // Read date from URL hash (e.g. editorial.html#2026-10-21) or default to Oct 21
  const hash = window.location.hash.replace('#', '').trim();
  const activeDate = (hash && (hash === "2026-10-19" || hash === "2026-10-20" || hash === "2026-10-21")) ? hash : "2026-10-21";

  // Dynamically load the correct daily dispatch file
  const script = document.createElement("script");
  script.src = `dispatch-${activeDate}.js`;

  script.onload = () => {
    const ed = window.DAILY_DISPATCH && window.DAILY_DISPATCH.editorial;
    if (!ed) return;

    // Populate title and subtitle
    document.getElementById("edTitle").textContent = ed.title;
    document.getElementById("edSubtitle").textContent = ed.subtitle;

    // Build out the sections dynamically using your object array
    const container = document.getElementById("edContentContainer");
    container.innerHTML = "";

    if (ed.sections && Array.isArray(ed.sections)) {
      ed.sections.forEach(sec => {
        const sectionDiv = document.createElement("div");
        sectionDiv.className = "editorial-section";
        sectionDiv.innerHTML = `
          <h3>${sec.heading}</h3>
          <p>${sec.body}</p>
        `;
        container.appendChild(sectionDiv);
      });
    }
  };

  document.body.appendChild(script);
});
</script>
</body>
</html>
