:root{
  --bg:#0a0a08;
  --surface:#151410;
  --card-bg:#ffffff;
  --card-ink:#11110f;
  --card-muted:#5e5a50;
  --text-primary:#eeeae0;
  --text-muted:#8e887b;
  --accent-red:#b3261e;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text-primary);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
a{color:inherit;text-decoration:none}
.top-red-bar{background:var(--accent-red);color:#ffffff;font-size:13px;font-weight:600;letter-spacing:.02em;margin-bottom:24px;}
.top-red-bar .wrap{display:flex;justify-content:space-between;align-items:center;min-height:42px;flex-wrap:wrap;gap:12px;padding-top:4px;padding-bottom:4px;}
.gmt-clock-wrap{display:flex;align-items:center;gap:8px;font-feature-settings:"tnum";font-variant-numeric:tabular-nums;}
.gmt-clock-wrap .live-indicator{width:7px;height:7px;border-radius:50%;background:#ffffff;animation:blink 1.8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.top-nav{display:flex;align-items:center;gap:22px;list-style:none;}
.top-nav a{color:#ffffff;transition:opacity .15s ease;font-weight:600;}
.top-nav a:hover{opacity:0.8;text-decoration:underline;}
.site-banner-wrap{max-width:1080px;margin:0 auto 16px;padding:0 20px;}
.site-banner{width:100%;height:auto;border-radius:12px;display:block;box-shadow:0 12px 32px rgba(0,0,0,0.5);border:1px solid #22201c;}
.lang-strip{padding:8px 0 28px;text-align:center;}
.lang-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;}
.lang-btn{background:var(--surface);color:var(--text-muted);border:1px solid transparent;outline:none;border-radius:999px;padding:6px 14px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s ease;}
.lang-btn:hover{color:var(--text-primary);background:#201e18;}
.lang-btn.active{background:var(--card-bg);color:var(--card-ink);font-weight:700;}
.control-hub{display:grid;grid-template-columns:1.45fr 1fr;gap:24px;margin-bottom:32px;}
.hub-card{background:var(--card-bg);color:var(--card-ink);border-radius:12px;padding:24px 28px;}
.hub-card h3{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:14px;letter-spacing:-.01em;}
.search-form{display:flex;gap:10px;}
.search-input{flex:1;background:#f5f2eb;border:none;outline:none;border-radius:8px;padding:12px 16px;font-family:var(--sans);font-size:15px;color:var(--card-ink);}
.search-btn{background:var(--card-ink);color:var(--card-bg);border:none;outline:none;border-radius:8px;padding:12px 20px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;}
